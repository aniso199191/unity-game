name: Build Android (Docker)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2022.3.48f1-android-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Activate Unity License
        run: |
          unity-activate --email ${{ secrets.UNITY_EMAIL }} --password ${{ secrets.UNITY_PASSWORD }}

      - name: Build APK
        run: |
          /opt/unity/Editor/Unity \
            -batchmode \
            -quit \
            -projectPath . \
            -executeMethod UnityEditor.BuildPlayerCommand.BuildAndroid \
            -logFile build.log
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBuild
          path: build/Android/*.apk
